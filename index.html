
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>AI 학습 카메라</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin-bottom: 8px;
    }

    video, img {
      width: 100%;
      border-radius: 12px;
      background: #111;
    }

    button {
      padding: 14px 18px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
    }

    .photo-area {
      margin-top: 22px;
    }

    #photo {
      display: none;
    }

    #status {
      color: #555;
    }
  </style>
</head>

<body>
  <h2>AI 학습 카메라</h2>
  <p id="status">카메라를 켜주세요.</p>

  <video id="camera"
         autoplay
         playsinline
         muted></video>

  <div>
    <button onclick="startCamera()">
      카메라 켜기
    </button>

    <button onclick="capturePhoto()">
      문제 촬영
    </button>

    <button onclick="stopCamera()">
      카메라 끄기
    </button>
  </div>

  <div class="photo-area">
    <h3>촬영한 사진</h3>
    <p>사진을 누르면 확대할 수 있어.</p>
    <img id="photo" alt="촬영한 문제">
  </div>

  <canvas id="canvas"
          style="display:none;"></canvas>

  <script>
    let stream = null;

    const video =
      document.getElementById("camera");

    const photo =
      document.getElementById("photo");

    const canvas =
      document.getElementById("canvas");

    const status =
      document.getElementById("status");

    async function startCamera() {
      try {
        stopCamera();

        stream = await navigator.mediaDevices
          .getUserMedia({
            audio: false,
            video: {
              facingMode: "environment",
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          });

        video.srcObject = stream;
        await video.play();

        status.textContent = "카메라 작동 중";

      } catch (error) {
        status.textContent =
          "카메라 오류: " + error.message;
      }
    }

    function capturePhoto() {
      if (!stream || !video.videoWidth) {
        alert("먼저 카메라를 켜주세요.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext("2d");

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photo.src = canvas.toDataURL(
        "image/jpeg",
        0.95
      );

      photo.style.display = "block";
      status.textContent = "문제 촬영 완료";
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(
          track => track.stop()
        );

        stream = null;
      }

      video.srcObject = null;
      status.textContent = "카메라 꺼짐";
    }

    photo.addEventListener("click", () => {
      if (!photo.src) return;

      const newWindow = window.open(
        photo.src,
        "_blank"
      );

      if (!newWindow) {
        alert("사진 확대 창을 열지 못했습니다.");
      }
    });
  </script>
</body>
</html>
