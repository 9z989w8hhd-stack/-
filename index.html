

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>AI 학습 카메라</title>

<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background: #f5f5f5;
    padding: 12px;
    margin: 0;
  }

  video, img {
    width: 100%;
    border-radius: 12px;
    background: #111;
  }

  button {
    padding: 14px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 15px;
  }

  .panel {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }

  .score {
    font-size: 28px;
    font-weight: bold;
  }

  #photo {
    display: none;
  }
</style>
</head>

<body>

<h2>AI 학습 카메라</h2>
<p id="status">카메라를 켜주세요.</p>

<video id="camera"
       autoplay
       muted
       playsinline></video>

<div>
  <button onclick="startCamera()">카메라 켜기</button>
  <button onclick="capturePhoto()">문제 촬영</button>
  <button onclick="stopCamera()">카메라 끄기</button>
</div>

<div class="panel">
  <h3>실시간 선명도 분석</h3>

  <div id="quality" class="score">
    대기 중
  </div>

  <p>선명도 점수: <span id="score">-</span></p>
  <p>현재 세션 최고 점수:
     <span id="best">-</span>
  </p>

  <small>
    점수는 상대적인 선명도 지표이며
    글씨 인식 정확도를 보장하지 않습니다.
  </small>
</div>

<div class="panel">
  <h3>촬영한 사진</h3>
  <img id="photo" alt="촬영 이미지">
</div>

<canvas id="canvas" style="display:none"></canvas>
<canvas id="analysis" style="display:none"></canvas>

<script>
let stream = null;
let timer = null;
let bestScore = 0;

const video = document.getElementById("camera");
const photo = document.getElementById("photo");
const canvas = document.getElementById("canvas");
const analysis = document.getElementById("analysis");
const statusText = document.getElementById("status");

async function startCamera() {
  stopCamera();
  bestScore = 0;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = stream;
    await video.play();

    statusText.textContent = "카메라 작동 중";

    timer = setInterval(checkSharpness, 700);

  } catch (error) {
    statusText.textContent =
      "카메라 오류: " + error.message;
  }
}

function checkSharpness() {
  if (!stream || !video.videoWidth) return;

  // 처리량을 줄이기 위한 축소 영상
  const w = 240;
  const h = 180;

  analysis.width = w;
  analysis.height = h;

  const ctx = analysis.getContext(
    "2d",
    { willReadFrequently: true }
  );

  ctx.drawImage(video, 0, 0, w, h);

  const data = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);

  for (let i = 0; i < gray.length; i++) {
    const p = i * 4;

    gray[i] =
      data[p] * 0.299 +
      data[p + 1] * 0.587 +
      data[p + 2] * 0.114;
  }

  // 라플라시안 분산으로 선명도 추정
  let sum = 0;
  let sumSq = 0;
  let count = 0;

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;

      const lap =
        4 * gray[i] -
        gray[i - 1] -
        gray[i + 1] -
        gray[i - w] -
        gray[i + w];

      sum += lap;
      sumSq += lap * lap;
      count++;
    }
  }

  const mean = sum / count;
  const score = Math.max(
    0,
    sumSq / count - mean * mean
  );

  if (score > bestScore) {
    bestScore = score;
  }

  const ratio = bestScore > 0
    ? score / bestScore
    : 0;

  let label = "상대적으로 흐림";

  if (score < 1) {
    label = "질감 부족 / 측정 어려움";
  } else if (ratio >= 0.8) {
    label = "상대적으로 선명";
  } else if (ratio >= 0.5) {
    label = "선명도 보통";
  }

  document.getElementById("score").textContent =
    score.toFixed(1);

  document.getElementById("best").textContent =
    bestScore.toFixed(1);

  document.getElementById("quality").textContent =
    label;
}

function capturePhoto() {
  if (!stream || !video.videoWidth) {
    alert("먼저 카메라를 켜주세요.");
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  photo.src = canvas.toDataURL("image/jpeg", 0.95);
  photo.style.display = "block";

  statusText.textContent = "촬영 완료";
}

function stopCamera() {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }

  if (stream) {
    stream.getTracks().forEach(
      track => track.stop()
    );
    stream = null;
  }

  video.srcObject = null;
  statusText.textContent = "카메라 꺼짐";
}

</script>
</body>
</html>
