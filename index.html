<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>AI 학습 카메라</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
    }
    video {
      width: 100%;
      border-radius: 12px;
      background: black;
    }
    button {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>AI 학습 카메라</h2>
  <p id="status">카메라를 켜주세요.</p>

  <video id="camera" autoplay playsinline muted></video>

  <button onclick="startCamera()">카메라 켜기</button>
  <button onclick="stopCamera()">카메라 끄기</button>

  <script>
    let stream = null;

    async function startCamera() {
      try {
        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "environment"
          }
        });

        const video = document.getElementById("camera");
        video.srcObject = stream;
        await video.play();

        document.getElementById("status").textContent =
          "카메라 작동 중";

      } catch (error) {
        document.getElementById("status").textContent =
          "카메라 오류: " + error.message;
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      document.getElementById("camera").srcObject = null;
      document.getElementById("status").textContent =
        "카메라 꺼짐";
    }
  </script>
</body>
</html>
